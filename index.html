<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>‏</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000 !important;
      overflow: hidden;
      cursor: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    #gameCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      cursor: none;
      display: block;
      z-index: 9999;
    }
    #gameCanvas.locked {
      cursor: none;
    }
  </style>
</head>
<body>
  <!-- Exact same element name style as original for pointer lock -->
  <canvas id="gameCanvas"></canvas>

  <script>
    // ============================================================
    // EXACT same Pointer Lock style as original camera demo
    // ============================================================
    const canvas = document.getElementById("gameCanvas");
    let prankTriggered = false;
    let audioCtx = null;
    let oscillators = [];
    let gainNode = null;

    // Make canvas full black
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    resize();
    window.addEventListener("resize", resize);

    // ===================== POINTER LOCK (exact original style) =====================
    function requestLock() {
      canvas.requestPointerLock();
    }

    function exitLock() {
      if (document.pointerLockElement) {
        document.exitPointerLock();
      }
    }

    // Same as original
    document.addEventListener("pointerlockchange", () => {
      if (document.pointerLockElement === canvas) {
        canvas.classList.add("locked");
        document.body.style.cursor = "none";
        document.documentElement.style.cursor = "none";
      } else {
        canvas.classList.remove("locked");
        document.body.style.cursor = "default";
        document.documentElement.style.cursor = "default";
        canvas.style.cursor = "default";
      }
    });

    document.addEventListener("pointerlockerror", () => {
      // fail silently
    });

    // Click anywhere on the black canvas → lock (exact original behaviour)
    canvas.addEventListener("click", () => {
      if (document.pointerLockElement !== canvas) {
        requestLock();
      }
    });

    // Also try on first pointerdown
    canvas.addEventListener("pointerdown", () => {
      if (document.pointerLockElement !== canvas) {
        requestLock();
      }
    });

    // ===================== EXIT ONLY ON Esc OR Ctrl+U =====================
    window.addEventListener("keydown", (e) => {
      // Esc → exit
      if (e.code === "Escape" || e.key === "Escape") {
        e.preventDefault();
        exitLock();
        return;
      }

      // Ctrl + u (small u) → exit
      if (e.ctrlKey && (e.key === "u" || e.key === "U" || e.code === "KeyU")) {
        e.preventDefault();
        exitLock();
        return;
      }

      // Baaki sab keys → music + try lock
      if (document.pointerLockElement !== canvas) {
        requestLock();
      }
      triggerPrank(e);
    }, true);

    // ===================== LOUD ALARM =====================
    function startLoudAlarm() {
      if (prankTriggered) return;
      prankTriggered = true;

      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.9;
        gainNode.connect(audioCtx.destination);

        const freqs = [220, 440, 660, 880, 1100, 1320, 1560];
        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          osc.type = i % 2 === 0 ? "sawtooth" : "square";
          osc.frequency.value = f;
          osc.connect(gainNode);
          osc.start();
          oscillators.push(osc);
        });

        let t = 0;
        setInterval(() => {
          if (!audioCtx) return;
          t += 0.12;
          oscillators.forEach((osc, i) => {
            const base = [220, 440, 660, 880, 1100, 1320, 1560][i];
            osc.frequency.setValueAtTime(
              base + Math.sin(t * 1.8 + i) * 220 + Math.random() * 50,
              audioCtx.currentTime
            );
          });
        }, 35);
      } catch (err) {}
    }

    function tryExternalMusic() {
      const a = new Audio("");
      a.volume = 1.0;
      a.loop = true;
      a.play().catch(() => {});
    }

    function triggerPrank(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      startLoudAlarm();
      tryExternalMusic();
    }

    // Mouse move / click / touch → music + keep lock
    ["mousedown", "mouseup", "click", "dblclick", "contextmenu",
     "pointerdown", "pointerup", "pointermove",
     "touchstart", "touchend", "touchmove", "wheel"].forEach(evt => {
      canvas.addEventListener(evt, (e) => {
        if (document.pointerLockElement !== canvas) {
          requestLock();
        }
        triggerPrank(e);
      }, { capture: true, passive: false });
    });

    // Keep screen pure black
    setInterval(() => {
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (document.pointerLockElement === canvas) {
        document.body.style.cursor = "none";
        document.documentElement.style.cursor = "none";
        canvas.style.cursor = "none";
      }
    }, 200);

    // Block right click
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("selectstart", e => e.preventDefault());
  </script>
</body>
</html>
