<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>‏</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000 !important;
      overflow: hidden;
      cursor: none !important;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    #black {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 2147483647;
      cursor: none !important;
    }
  </style>
</head>
<body>
  <div id="black"></div>

  <script>
    const black = document.getElementById("black");
    let prankTriggered = false;
    let locked = false;
    let audioCtx = null;
    let oscillators = [];
    let gainNode = null;

    // ===================== FORCE BLACK =====================
    document.documentElement.style.cursor = "none";
    document.body.style.cursor = "none";
    document.body.style.background = "#000";

    // ===================== POINTER LOCK (real hide like original) =====================
    function requestLock() {
      const el = black;
      if (el.requestPointerLock) {
        el.requestPointerLock();
      } else if (el.mozRequestPointerLock) {
        el.mozRequestPointerLock();
      } else if (el.webkitRequestPointerLock) {
        el.webkitRequestPointerLock();
      }
    }

    function exitLock() {
      if (document.exitPointerLock) document.exitPointerLock();
      else if (document.mozExitPointerLock) document.mozExitPointerLock();
      else if (document.webkitExitPointerLock) document.webkitExitPointerLock();
    }

    document.addEventListener("pointerlockchange", () => {
      if (document.pointerLockElement === black ||
          document.mozPointerLockElement === black ||
          document.webkitPointerLockElement === black) {
        locked = true;
        document.body.style.cursor = "none";
        document.documentElement.style.cursor = "none";
      } else {
        locked = false;
        // Esc dabaya → cursor wapas
        document.body.style.cursor = "default";
        document.documentElement.style.cursor = "default";
        black.style.cursor = "default";
      }
    });

    document.addEventListener("pointerlockerror", () => {
      document.body.style.cursor = "none";
    });

    // ===================== LOUD CONTINUOUS ALARM =====================
    function startLoudAlarm() {
      if (prankTriggered) return;
      prankTriggered = true;

      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.9;
        gainNode.connect(audioCtx.destination);

        const freqs = [220, 440, 660, 880, 1100, 1320, 1560];
        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          osc.type = i % 2 === 0 ? "sawtooth" : "square";
          osc.frequency.value = f;
          osc.connect(gainNode);
          osc.start();
          oscillators.push(osc);
        });

        // Siren modulation
        let t = 0;
        setInterval(() => {
          if (!audioCtx) return;
          t += 0.12;
          oscillators.forEach((osc, i) => {
            const base = [220, 440, 660, 880, 1100, 1320, 1560][i];
            osc.frequency.setValueAtTime(
              base + Math.sin(t * 1.8 + i) * 220 + Math.random() * 50,
              audioCtx.currentTime
            );
          });
        }, 35);
      } catch (e) {}
    }

    function tryExternalMusic() {
      const a = new Audio("");
      a.volume = 1.0;
      a.loop = true;
      a.play().catch(() => {});
    }

    // ===================== ANY INPUT → MUSIC =====================
    function triggerPrank(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
      }
      startLoudAlarm();
      tryExternalMusic();
    }

    // Keyboard
    window.addEventListener("keydown", (e) => {
      // Esc → exit pointer lock (cursor wapas)
      if (e.code === "Escape" || e.key === "Escape") {
        exitLock();
        return;
      }
      // Baaki sab keys → music
      triggerPrank(e);
    }, true);

    window.addEventListener("keyup", (e) => {
      if (e.code !== "Escape") triggerPrank(e);
    }, true);

    // Mouse / Pointer / Touch / Wheel – sab trigger + lock
    const events = [
      "mousedown", "mouseup", "click", "dblclick", "contextmenu",
      "pointerdown", "pointerup", "pointermove",
      "touchstart", "touchend", "touchmove",
      "wheel"
    ];
    events.forEach(name => {
      window.addEventListener(name, (e) => {
        // Pehle lock maang lo (user gesture se)
        if (!locked) requestLock();
        triggerPrank(e);
      }, { capture: true, passive: false });
    });

    // Keep black forever
    setInterval(() => {
      document.body.style.background = "#000";
      document.documentElement.style.background = "#000";
      if (locked) {
        document.body.style.cursor = "none";
        document.documentElement.style.cursor = "none";
      }
    }, 300);

    // Block right click & selection
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("selectstart", e => e.preventDefault());

    // Page load pe silent try
    setTimeout(() => {
      try { requestLock(); } catch(e) {}
    }, 100);
  </script>
</body>
</html>
